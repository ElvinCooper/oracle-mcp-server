[project]
name = "oracle-mcp-server"
version = "0.1.0"
description = "MCP server para conectar a Oracle 11g (thick mode) desde opencode / clientes MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0",
    "oracledb>=2.0.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_mcp"]
