[project]
name = "oracle-mcp-server"
version = "0.1.0"
description = "MCP server para conectar a Oracle 11g (thick mode) desde clientes MCP (opencode, Claude Code, Codex, etc.)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Elvin Cooper", email = "ing.elvin01cooper@gmail.com" },
]
keywords = ["mcp", "oracle", "oracledb", "model-context-protocol", "11g", "database", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.6.0,<2",
    "oracledb>=2.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
oracle-mcp = "oracle_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
